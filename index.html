<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f9d73"><title>گفتگو — Language Exchange</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f7f6;--s:#fff;--s2:#e9f0ee;--tx:#10231d;--mu:#6b8079;--ac:#0f9d73;--bd:#dce6e3;--me:#d7f5e8}
[data-t=dark]{--bg:#0c1512;--s:#13201c;--s2:#1b2c27;--tx:#e6f2ee;--mu:#8aa69d;--ac:#1fc08f;--bd:#233732;--me:#12453a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Nastaliq Urdu",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;max-width:560px;margin:auto;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
header.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--ac);color:#fff}
header.top h1{font-size:22px;flex:1}
#main{flex:1;overflow-y:auto;padding:12px}
nav{display:flex;background:var(--s);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.row .t{flex:1;min-width:0}.row b{display:block}.row small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.tag{display:inline-block;background:var(--s2);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 4px 0 0}
.tag.m{background:var(--ac);color:#fff}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--s);margin-bottom:10px}
.btn{background:var(--ac);color:#fff;border-radius:10px;padding:11px 16px;font-weight:700;width:100%}
.btn.g{background:var(--s2);color:var(--tx)}
.mu{color:var(--mu)}.dot{width:10px;height:10px;border-radius:50%;background:var(--ac)}
#auth{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:24px;max-width:560px;margin:auto;z-index:5}
#auth h1{font-size:44px;color:var(--ac);text-align:center;margin:20px 0 4px}
#auth p.s{text-align:center;color:var(--mu);margin-bottom:20px}
#err{color:#d33;min-height:20px;margin-bottom:8px;font-size:13px}
#chat,#sheet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:auto;z-index:4;padding-top:env(safe-area-inset-top)}
#sheet{z-index:6;padding:16px;overflow:auto}
#chat header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s);border-bottom:1px solid var(--bd)}
#chat header .av{width:38px;height:38px;font-size:15px}
#ml{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--s);border:1px solid var(--bd);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me);border-color:transparent}
.m i{display:block;font-size:10px;color:var(--mu);font-style:normal;margin-top:2px;text-align:end}
#cf{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--s);border-top:1px solid var(--bd)}
#cf input{margin:0;flex:1;border-radius:99px}#cf button{background:var(--ac);color:#fff;border-radius:50%;width:44px;font-size:18px}
</style></head><body>
<div id="auth" hidden>
 <h1>گفتگو</h1><p class="s">Talk. Learn. Connect with the world.</p>
 <div id="setup" class="card" hidden><b>Setup needed:</b> paste your Firebase config at the top of the script in index.html (see README).</div>
 <form id="af" autocomplete="off">
  <input id="a_name" placeholder="Your name" maxlength="30" hidden>
  <input id="a_user" placeholder="Username (a–z, 0–9, _)" maxlength="20" autocapitalize="none">
  <input id="a_pass" type="password" placeholder="Password (min 6)">
  <select id="a_nat" hidden></select><select id="a_lrn" hidden></select>
  <div id="err"></div>
  <button class="btn" id="a_go">Log in</button>
  <button type="button" class="btn g" id="a_sw" style="margin-top:8px">Create new account</button>
 </form>
</div>
<header class="top"><h1 id="ttl">گفتگو</h1><button id="thm" style="color:#fff;font-size:20px" aria-label="Theme">🌓</button></header>
<div id="main"></div>
<nav><button data-t="chats"><span>💬</span>Chats</button><button data-t="discover"><span>🌍</span>Discover</button><button data-t="moments"><span>✨</span>Moments</button><button data-t="me"><span>👤</span>Me</button></nav>
<div id="chat" hidden></div><div id="sheet" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== Firebase config (project: guftugu-4472d) ======
const FB={apiKey:"AIzaSyDPK4nDaiV6vF4EGkbXzAZ11x-p6VDJyxg",authDomain:"guftugu-4472d.firebaseapp.com",projectId:"guftugu-4472d",storageBucket:"guftugu-4472d.firebasestorage.app",messagingSenderId:"705342846209",appId:"1:705342846209:web:9b2fe7314af032c3bd1700"};
// =============================================================
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LANGS=['Urdu','English','Arabic','Hindi','Punjabi','Pashto','Persian','Turkish','Spanish','French','German','Russian','Chinese','Japanese','Korean','Indonesian'];
const hue=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const av=n=>`<div class="av" style="background:hsl(${hue(n)} 50% 42%)">${esc((n||'?').trim()[0]||'?').toUpperCase()}</div>`;
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(_){return null}};
const ago=t=>{if(!t)return'';const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,'0');return d.toDateString()===n.toDateString()?p(d.getHours())+':'+p(d.getMinutes()):d.toLocaleDateString([], {day:'numeric',month:'short'})};
const ms=x=>x&&x.toMillis?x.toMillis():Date.now();
const opts=(sel,def)=>sel.innerHTML=LANGS.map(l=>`<option ${l===def?'selected':''}>${l}</option>`).join('');
document.documentElement.dataset.t=ls('t')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#thm').onclick=()=>{const t=document.documentElement.dataset.t==='dark'?'light':'dark';document.documentElement.dataset.t=t;ls('t',t)};

let auth,db,me=null,cur='chats',unsubs=[],mode='login';
const ok=FB.apiKey&&!FB.apiKey.startsWith('PASTE');
if(ok){firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();}
else{$('#auth').hidden=false;$('#setup').hidden=false}
const clean=()=>{unsubs.forEach(f=>f());unsubs=[]};

// ---------- Auth ----------
opts($('#a_nat'),'Urdu');opts($('#a_lrn'),'English');
function authMode(m){mode=m;const s=m==='signup';['#a_name','#a_nat','#a_lrn'].forEach(i=>$(i).hidden=!s);$('#a_go').textContent=s?'Sign up':'Log in';$('#a_sw').textContent=s?'I already have an account':'Create new account';$('#err').textContent=''}
$('#a_sw').onclick=()=>authMode(mode==='login'?'signup':'login');
const E={'auth/email-already-in-use':'This username is taken.','auth/invalid-credential':'Wrong username or password.','auth/wrong-password':'Wrong username or password.','auth/user-not-found':'Wrong username or password.','auth/weak-password':'Password must be at least 6 characters.','auth/network-request-failed':'No internet connection.','auth/too-many-requests':'Too many attempts. Try later.'};
$('#af').onsubmit=async e=>{e.preventDefault();if(!ok)return;const u=$('#a_user').value.trim().toLowerCase(),p=$('#a_pass').value,er=$('#err'),b=$('#a_go');er.textContent='';
 if(!/^[a-z0-9_]{3,20}$/.test(u))return er.textContent='Username: 3–20 letters, numbers or _';
 const name=$('#a_name').value.trim();if(mode==='signup'&&!name)return er.textContent='Please enter your name.';
 b.disabled=true;
 try{const mail=u+'@guftugu.app';
  if(mode==='signup'){const c=await auth.createUserWithEmailAndPassword(mail,p);
   await db.collection('users').doc(c.user.uid).set({name,username:u,native:$('#a_nat').value,learning:$('#a_lrn').value,bio:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
  else await auth.signInWithEmailAndPassword(mail,p);
 }catch(x){er.textContent=E[x.code]||x.message}
 b.disabled=false};
if(ok)auth.onAuthStateChanged(async u=>{clean();
 if(!u){me=null;$('#auth').hidden=false;return}
 let d;for(let i=0;i<4&&!d;i++){const s=await db.collection('users').doc(u.uid).get().catch(()=>null);if(s&&s.exists)d=s.data();else await new Promise(r=>setTimeout(r,400))}
 if(!d){d={name:u.email.split('@')[0],username:u.email.split('@')[0],native:'Urdu',learning:'English',bio:''};await db.collection('users').doc(u.uid).set(d)}
 me={id:u.uid,...d};$('#auth').hidden=true;tab(cur);
 db.collection('users').doc(u.uid).update({seen:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{})});

// ---------- Tabs ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function tab(t){if(!me)return;cur=t;clean();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 $('#ttl').textContent={chats:'گفتگو',discover:'Discover',moments:'Moments',me:'Me'}[t];({chats:vChats,discover:vDiscover,moments:vMoments,me:vMe})[t]($('#main'))}
const err=m=>{$('#main').innerHTML=`<p class="mu" style="padding:20px;text-align:center">${esc(m)}</p>`};

// ---------- Chats ----------
const cid=(a,b)=>[a,b].sort().join('_');
function vChats(el){el.innerHTML='<p class="mu" style="text-align:center;padding:20px">Loading…</p>';
 unsubs.push(db.collection('chats').where('members','array-contains',me.id).onSnapshot(s=>{
  const L=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.lastAt).sort((a,b)=>ms(b.lastAt)-ms(a.lastAt));
  if(cur!=='chats')return;
  el.innerHTML=L.length?L.map(c=>{const o=c.members.find(x=>x!==me.id),n=(c.names||{})[o]||'User',un=c.lastFrom!==me.id&&ms(c.lastAt)>(+ls('seen_'+c.id)||0);
   return`<div class="row" data-o="${esc(o)}" data-n="${esc(n)}">${av(n)}<div class="t"><b>${esc(n)}</b><small>${esc(c.last)}</small></div><div style="text-align:end"><small>${ago(ms(c.lastAt))}</small>${un?'<div class="dot" style="margin-left:auto"></div>':''}</div></div>`}).join(''):'<div class="card" style="text-align:center">No chats yet.<br>Open <b>Discover</b> and say hello 👋</div>';
  el.querySelectorAll('.row').forEach(r=>r.onclick=()=>openChat({id:r.dataset.o,name:r.dataset.n}));
 },e=>err('Could not load chats. '+e.code)))}

function openChat(u){const id=cid(me.id,u.id),el=$('#chat');el.hidden=false;
 el.innerHTML=`<header><button id="bk" style="font-size:26px">‹</button>${av(u.name)}<b style="flex:1">${esc(u.name)}</b></header><div id="ml"></div><form id="cf" autocomplete="off"><input id="ci" placeholder="Type a message…" maxlength="2000"><button aria-label="Send">➤</button></form>`;
 const col=db.collection('chats').doc(id).collection('msgs'),ml=$('#ml');let stop;
 const close=()=>{stop&&stop();el.hidden=true;el.innerHTML='';if(cur==='chats')tab('chats')};$('#bk').onclick=close;
 stop=col.orderBy('at').limitToLast(200).onSnapshot(s=>{
  ml.innerHTML=s.docs.map(d=>{const m=d.data();return`<div class="m ${m.from===me.id?'me':''}">${esc(m.text)}<i>${ago(ms(m.at))}</i></div>`}).join('')||'<p class="mu" style="text-align:center;margin:auto">Say hello 👋</p>';
  ml.scrollTop=ml.scrollHeight;ls('seen_'+id,Date.now())},e=>{ml.innerHTML='<p class="mu">Cannot open chat ('+esc(e.code)+')</p>'});
 $('#cf').onsubmit=async e=>{e.preventDefault();const i=$('#ci'),text=i.value.trim();if(!text)return;i.value='';
  const ts=firebase.firestore.FieldValue.serverTimestamp(),b=db.batch();
  b.set(db.collection('chats').doc(id),{members:[me.id,u.id].sort(),names:{[me.id]:me.name,[u.id]:u.name},last:text.slice(0,80),lastAt:ts,lastFrom:me.id},{merge:true});
  b.set(col.doc(),{from:me.id,text,at:ts});
  try{await b.commit()}catch(x){i.value=text;alert('Message not sent: '+x.code)}};
 $('#ci').focus()}

// ---------- Discover ----------
function vDiscover(el){el.innerHTML='<input id="q" placeholder="Search name or username…"><div id="ul"><p class="mu" style="text-align:center">Loading…</p></div>';let all=[];
 const show=()=>{const q=$('#q').value.trim().toLowerCase();
  const L=all.filter(u=>!q||(u.name+u.username).toLowerCase().includes(q)).map(u=>({...u,sc:(u.native===me.learning?2:0)+(u.learning===me.native?2:0)})).sort((a,b)=>b.sc-a.sc);
  $('#ul').innerHTML=L.length?L.map(u=>`<div class="row" data-i="${esc(u.id)}">${av(u.name)}<div class="t"><b>${esc(u.name)}</b><small>@${esc(u.username)}</small><div><span class="tag ${u.native===me.learning?'m':''}">Speaks ${esc(u.native)}</span><span class="tag ${u.learning===me.native?'m':''}">Learning ${esc(u.learning)}</span></div></div></div>`).join(''):'<p class="mu" style="text-align:center">No users found.</p>';
  $('#ul').querySelectorAll('.row').forEach(r=>r.onclick=()=>profile(all.find(u=>u.id===r.dataset.i)))};
 $('#q').oninput=show;
 db.collection('users').limit(100).get().then(s=>{all=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!==me.id);show()}).catch(e=>err('Could not load users. '+e.code))}
function profile(u){const s=$('#sheet');s.hidden=false;
 s.innerHTML=`<button id="x" style="font-size:26px;align-self:flex-start">‹</button><div style="text-align:center;margin-top:10px"><div class="av" style="width:90px;height:90px;font-size:36px;margin:auto">${esc(u.name[0]).toUpperCase()}</div><h2 style="margin-top:10px">${esc(u.name)}</h2><p class="mu">@${esc(u.username)}</p><p style="margin:14px 0">${esc(u.bio||'No bio yet.')}</p><span class="tag m">Speaks ${esc(u.native)}</span><span class="tag m">Learning ${esc(u.learning)}</span></div><button class="btn" id="hi" style="margin-top:24px">💬 Send message</button>`;
 $('#x').onclick=()=>{s.hidden=true};$('#hi').onclick=()=>{s.hidden=true;openChat({id:u.id,name:u.name})}}

// ---------- Moments ----------
function vMoments(el){el.innerHTML='<div class="card"><textarea id="mt" rows="2" maxlength="500" placeholder="Share something in any language…" style="margin-bottom:8px"></textarea><button class="btn" id="mp">Post</button></div><div id="mf"></div>';
 $('#mp').onclick=async()=>{const t=$('#mt').value.trim();if(!t)return;$('#mt').value='';
  try{await db.collection('moments').add({uid:me.id,name:me.name,text:t,lang:me.native,likes:[],at:firebase.firestore.FieldValue.serverTimestamp()})}catch(x){alert('Could not post: '+x.code)}};
 unsubs.push(db.collection('moments').orderBy('at','desc').limit(50).onSnapshot(s=>{if(cur!=='moments')return;
  $('#mf').innerHTML=s.docs.map(d=>{const m=d.data(),l=(m.likes||[]),mine=l.includes(me.id);
   return`<div class="card"><div style="display:flex;gap:10px;align-items:center">${av(m.name)}<div style="flex:1"><b>${esc(m.name)}</b><small class="mu" style="display:block">${esc(m.lang||'')} · ${ago(ms(m.at))}</small></div>${m.uid===me.id?`<button data-d="${d.id}" class="mu">🗑</button>`:''}</div><p style="margin:10px 0;white-space:pre-wrap;word-break:break-word">${esc(m.text)}</p><button data-l="${d.id}" data-m="${mine?1:0}" style="color:${mine?'var(--ac)':'var(--mu)'}">${mine?'❤️':'🤍'} ${l.length}</button></div>`}).join('')||'<p class="mu" style="text-align:center">No moments yet. Be the first!</p>';
  $('#mf').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>db.collection('moments').doc(b.dataset.l).update({likes:firebase.firestore.FieldValue[b.dataset.m==='1'?'arrayRemove':'arrayUnion'](me.id)}).catch(()=>{}));
  $('#mf').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>confirm('Delete this moment?')&&db.collection('moments').doc(b.dataset.d).delete().catch(()=>{}));
 },e=>err('Could not load moments. '+e.code)))}

// ---------- Me ----------
function vMe(el){el.innerHTML=`<div class="card" style="text-align:center"><div class="av" style="width:80px;height:80px;font-size:32px;margin:auto;background:hsl(${hue(me.name)} 50% 42%)">${esc(me.name[0]).toUpperCase()}</div><p class="mu" style="margin-top:6px">@${esc(me.username)}</p></div>
 <div class="card"><label class="mu">Name</label><input id="p_n" maxlength="30" value="${esc(me.name)}"><label class="mu">Bio</label><textarea id="p_b" rows="3" maxlength="200">${esc(me.bio||'')}</textarea><label class="mu">I speak</label><select id="p_nat"></select><label class="mu">I'm learning</label><select id="p_lrn"></select><button class="btn" id="p_s">Save</button></div>
 <button class="btn g" id="lo">Log out</button>`;
 opts($('#p_nat'),me.native);opts($('#p_lrn'),me.learning);
 $('#p_s').onclick=async()=>{const n=$('#p_n').value.trim();if(!n)return;const d={name:n,bio:$('#p_b').value.trim(),native:$('#p_nat').value,learning:$('#p_lrn').value};
  try{await db.collection('users').doc(me.id).update(d);Object.assign(me,d);$('#p_s').textContent='Saved ✓';setTimeout(()=>{if($('#p_s'))$('#p_s').textContent='Save'},1500)}catch(x){alert('Could not save: '+x.code)}};
 $('#lo').onclick=()=>auth.signOut()}

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
